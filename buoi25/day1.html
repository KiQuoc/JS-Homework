<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng Đơn Giản</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        table { 
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td { 
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2; 
        }

        input[type="number"] {
            width: 60px; 
            padding: 5px; 
            text-align: center; 
        }

        button { 
            padding: 8px 15px;
            cursor: pointer; 
            border: 1px solid #ccc; 
            background-color: #eee; 
        }
        .action-buttons button {
            margin-right: 10px; 
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">DANH SÁCH SẢN PHẨM</h1>
    <table id="product-list">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Thêm vào giỏ</th>
            </tr>
        </thead>
        <tbody id="product-list-body">
            </tbody>
    </table>

    <h1 style="margin-top: 40px;">Giỏ hàng</h1>
    <table id="cart-table">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
                <th>Xóa</th>
            </tr>
        </thead>
        <tbody id="cart-body">
            </tbody>
        <tfoot id="cart-footer">
            </tfoot>
    </table>

    <div class="action-buttons">
        <button id="update-cart-btn">Cập nhật giỏ hàng</button>
        <button id="clear-cart-btn">Xóa giỏ hàng</button>
    </div>

    <script src="./day1.js"></script>
</body>
</html>

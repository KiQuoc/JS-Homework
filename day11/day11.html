<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .up{
            color: green;
        }
        .down{
            color: red
        }
        .up,.down{
            font-size: 0.85rem;
            cursor: pointer;
        }
        .select{
            border: 1px solid green;
        }
        ul{
            list-style: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid red;
        }
        ul li{
            margin : 10px 0;
            padding:  5px 10px;

        }
        .contextMenu {
            position: absolute;
            background: gray;
            color: white;
            display: none;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .contextMenu div {
            padding: 6px 15px;
            cursor: pointer;
        }

        .contextMenu div:hover {
            background: #555;
        }
        .deleteBtn{
            color: red;
        }
        .box{
            display: none;
        }
    </style>
</head>
<body>
    <ul>
        <li>Item 1 <span class="up">Up</span> <span class="down">Down</span></li>
        <li>Item 2 <span class="up">Up</span> <span class="down">Down</span></li>
        <li>Item 3 <span class="up">Up</span> <span class="down">Down</span></li>
        <li>Item 4 <span class="up">Up</span> <span class="down">Down</span></li>
        <li>Item 5 <span class="up">Up</span> <span class="down">Down</span></li>

    </ul>
    
    <div class="contextMenu">
        <div class="editBtn">Đổi tên
        </div>
        <div class="deleteBtn">Xóa</div>
    </div>
    
    <div class="box">
        <input type="text" placeholder="Nhập nội dung..." class="inputItem">
        <button class="addBtn">Add</button>
    </div>

    
    <script src="./day11.js"></script>
    
</body>
</html>

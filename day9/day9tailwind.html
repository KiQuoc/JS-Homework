<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
 <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
/>
</head>
<body class="min-h-screen flex items-center justify-center bg-purple-600">
    
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center  ">Create a new account</h1>
        <form action="" id="registerForm" class="">

            <!-- User name -->
             <label for="username" class="block font-semibold mb-1" >User name</label>
             <div class="relative">
                <input id="username" type="text" class="w-full border rounded-md px-3 py-2 focus:outline-none" placeholder="Enter your username">
                <span class="absolute right-3 top-2 hidden text-green-500" id="usernameCheck"><i class="fa-solid fa-check"></i></span>
                <span class="absolute right-3 top-2 hidden text-red-500" id="usernameErrorIcon"><i class="fa-solid fa-exclamation"></i></span>
             </div>
             <p class="text-red-500 text-sm mt-1 hidden" id="usernameError">Username cannot be blank</p>

            <!-- Email -->
             <label for="email" class=" block font-semibold mb-1 mt-4">Email</label>
             <div class="relative">
                <input id="email" type="email" class="w-full border rounded-md px-3 py-2 focus:outline-none" placeholder="Enter your email">
                <span class="absolute right-3 top-2 hidden text-green-500" id="emailCheck"><i class="fa-solid fa-check"></i></span>
                <span class="absolute right-3 top-2 hidden text-red-500" id="emailErrorIcon"><i class="fa-solid fa-exclamation"></i></span>
             </div>
             <p class="text-red-500 text-sm mt-1 hidden" id="emailError">Please enter valid email address</p>

            <!-- Password --> 
             <label for="password" class="block font-semibold mb-1 mt-4">Password</label>
             <div class="relative">
                <input id="password" type="password"  class="w-full border rounded-md px-3 py-2 focus:outline-none" placeholder="Enter your password">
                <span class="absolute right-3 top-2 hidden text-green-500" id="passwordCheck"><i class="fa-solid fa-check"></i></span>
                <span class="absolute right-3 top-2 hidden text-red-500" id="passwordErrorIcon"><i class="fa-solid fa-exclamation"></i></span>
             </div>
             <p class=" text-red-500 text-sm mt-1 hidden" id="passwordError">Password cannot be blank</p>
        
            <!-- Password Confirmation -->
             <label for="confirmPassword" class="block font-semibold mb-1 mt-4">Password Confirmation</label>
             <div class="relative">
                <input id="confirmPassword" type="password" class="w-full border rounded-md px-3 py-2 focus:outline-none" placeholder="Enter password confirmation" >
                <span class="absolute right-3 top-2 hidden text-green-500" id="confirmCheck"><i class="fa-solid fa-check"></i></span>
                <span class="absolute right-3 top-2 hidden text-red-500" id="confirmErrorIcon"><i class="fa-solid fa-exclamation"></i></span>
             </div>
             <p class=" text-red-500 text-sm mt-1 hidden" id="confirmError">Password does not match</p>
            
            <!-- Create account -->
            <button
                type="submit"
                class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700 font-semibold mt-4 ">
                Create account
            </button>
                
        </form>

    </div>
    <script src="./tailwind.js"></script>
</body>
</html>
